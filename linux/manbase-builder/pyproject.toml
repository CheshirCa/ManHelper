[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manbase-builder"
version = "0.1.0"
description = "Build a portable, Unicode SQLite database of Linux manual pages"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "CheshirCa"}]

[project.optional-dependencies]
test = ["pytest>=8.0"]
zstd = ["zstandard>=0.22"]

[project.scripts]
manbase-builder = "manbase_builder.main:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["manbase_builder*"]
